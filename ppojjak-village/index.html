<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뽀짝 친구 마을</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff8fb8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--ink:#6a4a7a;--pink:#ff8fb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Jua","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:#ffeef6;color:var(--ink);touch-action:manipulation}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:linear-gradient(#ffe9f3,#e6f3ff)}
.screen.active{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:none;height:64px}
.sp{flex:1}
.btn{border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #e6cfe0;font-size:28px;min-width:54px;height:48px;padding:0 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e6cfe0}
.btn.big{font-size:46px;min-width:100px;height:84px;border-radius:26px}
.btn[hidden]{display:none}
.coins,.pill{background:#fff7d6;border-radius:22px;padding:6px 14px;font-size:22px;font-weight:800;box-shadow:0 4px 0 #f0dc9c;color:#b07a00;white-space:nowrap}
.pill{background:#fff;box-shadow:0 4px 0 #e6cfe0;color:var(--ink)}
.stage{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
canvas{display:block;touch-action:none}
.tray{flex:none;display:flex;gap:10px;overflow-x:auto;padding:10px 12px 14px;background:rgba(255,255,255,.7);border-top:3px solid #fff}
.tabs{flex:none;display:flex;gap:6px;padding:6px 8px;justify-content:center}
.tab{font-size:24px;flex:1;max-width:58px;min-width:0;padding:0;height:50px;border-radius:18px;border:3px solid transparent;background:#fff;box-shadow:0 3px 0 #e6cfe0;cursor:pointer}
.tab.sel{border-color:var(--pink);background:#fff0f6}
.chip{flex:none;width:72px;height:72px;border-radius:20px;border:4px solid #fff;background:#fff;box-shadow:0 4px 0 #e6cfe0;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative;cursor:pointer;padding:0}
.chip canvas{width:64px;height:64px}
.chip.sel{border-color:var(--pink);background:#fff0f6}
.chip.lock span.e{opacity:.45;filter:grayscale(.7)}
.chip .price{position:absolute;bottom:-6px;right:-4px;background:#ffd34d;border-radius:12px;font-size:14px;padding:1px 7px;font-weight:800;color:#8a5a00;box-shadow:0 2px 0 #e0b000}
.chip.shake{animation:shake .35s}
.chip.sw{width:60px;height:60px;border-radius:50%}
.sep{flex:none;width:6px;border-radius:3px;background:#e8d6ee;margin:6px 2px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ov{position:absolute;inset:0;background:rgba(255,238,248,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5;text-align:center}
.ov.show{display:flex}
.ov .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.ov .huge{font-size:80px;line-height:1}
.ov .stars{font-size:56px;letter-spacing:6px}
.ov .stars .off{filter:grayscale(1);opacity:.3}
.ov .info{font-size:28px;font-weight:800}
.hero{flex:none;height:min(34vh,260px);display:flex;align-items:center;justify-content:center;min-height:0}
.title{font-size:clamp(28px,6vw,46px);font-weight:900;text-align:center;margin:0;color:#ff6fa3;text-shadow:0 3px 0 #fff,0 6px 0 #ffd6e7}
.menu{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:10px 16px 18px;max-width:640px;width:100%;margin:0 auto}
.mb{border:0;border-radius:28px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;color:#fff;font-weight:900;box-shadow:0 7px 0 rgba(0,0,0,.14);transition:transform .1s}
.mb:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.mb .ic{font-size:clamp(40px,9vh,70px);line-height:1}
.mb .lb{font-size:clamp(15px,2.6vh,22px);text-shadow:0 2px 0 rgba(0,0,0,.15)}
.book{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:8px 14px 20px;max-width:560px;width:100%;margin:0 auto;align-content:start}
.card{background:#fff;border-radius:24px;padding:8px 4px 8px;text-align:center;border:4px solid #fff;box-shadow:0 5px 0 #e6cfe0;cursor:pointer;position:relative}
.card canvas{width:100%;max-width:110px;height:auto;aspect-ratio:1}
.card .nm{font-size:18px;font-weight:800}
.card.act{border-color:var(--pink);background:#fff0f6}
.card.act::after{content:"💖";position:absolute;top:2px;right:6px;font-size:22px}
.card.hop{animation:hop .5s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) scale(1.06)}}
.songs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(92%,420px)}
.songb{flex-direction:column;height:96px;min-width:0;padding:0;font-size:38px;border-radius:24px;gap:2px}
.songb .ss{font-size:13px;letter-spacing:-1px}
.eggbar{flex:none;display:flex;justify-content:center;align-items:center;gap:14px;padding:6px 10px 20px;min-height:100px}

.hero{height:min(24vh,200px)}
.menu{overflow:auto;grid-auto-rows:minmax(96px,1fr)}
.profwrap{flex:1;display:flex;gap:16px;align-items:center;justify-content:center;padding:20px;flex-wrap:wrap}
.pcard{background:#fff;border:5px solid #fff;border-radius:32px;box-shadow:0 8px 0 #e6cfe0;padding:12px 18px 16px;text-align:center;cursor:pointer;width:min(44%,200px);min-width:150px}
.pcard:active{transform:translateY(4px)}
.pcard canvas{width:100%;max-width:150px;height:auto;aspect-ratio:1}
.pcard .pl{font-size:24px;font-weight:900}
.hub{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:10px 16px 20px;max-width:560px;width:100%;margin:0 auto;align-content:start;grid-auto-rows:minmax(118px,auto)}
.hub[hidden],.quiz[hidden],.book[hidden],.tbar[hidden]{display:none}
.hcard{border:0;border-radius:26px;color:#fff;font-family:inherit;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.14);padding:10px}
.hcard:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.hcard .ic{font-size:50px;line-height:1}.hcard .lb{font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.hcard .lv{background:rgba(255,255,255,.9);color:#6a4a7a;border-radius:14px;padding:1px 10px;font-size:16px}
.quiz{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 14px 20px}
.qtop{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:6px}.dot{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #e6cfe0}.dot.on{background:#ffd34d;border-color:#f0b000}
.tbar{width:min(90%,400px);height:12px;border-radius:8px;background:#fff;overflow:hidden}.tbar i{display:block;height:100%;width:100%;background:#ff8fb8}
.qprompt{text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.qprompt .pic{font-size:92px;line-height:1.1}
.qprompt .wtxt{font-size:40px;font-weight:900}
.qprompt .sent{font-size:28px;font-weight:900;line-height:1.55;max-width:380px}
.blank{display:inline-block;min-width:72px;border-bottom:5px dashed #ff8fb8;color:#ff8fb8}
.blank.fill{border-bottom-color:#5ccf8a;color:#2fa564}
.say{font-size:38px;border:0;background:#fff;border-radius:50%;width:62px;height:62px;box-shadow:0 4px 0 #e6cfe0;cursor:pointer;padding:0}
.slots{display:flex;gap:10px;align-items:center;justify-content:center}
.slot{width:62px;height:74px;border-radius:18px;background:#fff;border:4px dashed #ffb7d5;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:#6a4a7a}
.slot.on{border-style:solid;background:#fff0f6}
.built{font-size:78px;font-weight:900;color:#ff6fa3;min-height:92px}
.qopts{display:grid;gap:12px;width:min(100%,420px)}
.qopt{height:90px;border-radius:24px;border:4px solid #fff;background:#fff;box-shadow:0 5px 0 #e6cfe0;font-family:inherit;font-weight:900;font-size:52px;color:#6a4a7a;cursor:pointer;padding:0}
.qopt.wide{height:66px;font-size:28px}
.qopt.ok{background:#d6f5d6;border-color:#5ccf8a}
.qopt.no{background:#ffe0e0;border-color:#ff7a7a;animation:shake .35s}
.lvb{flex-direction:column;font-size:40px;height:100px;gap:2px;min-width:84px;padding:0 6px}.lvb small{font-size:14px;font-weight:800}
#lvOv{z-index:30;background:rgba(255,246,214,.96)}
.lvbig{font-size:42px;font-weight:900;color:#ff6fa3;text-shadow:0 3px 0 #fff}
.lvnum{font-size:80px;font-weight:900;color:#ffa31f}
.bounce{animation:bnc 1s infinite}@keyframes bnc{50%{transform:translateY(-14px) scale(1.08)}}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(92%,420px);max-height:55%;overflow:auto}
.gal img{width:100%;border-radius:18px;border:4px solid #fff;box-shadow:0 4px 0 #e6cfe0;background:#fff;cursor:pointer}
.tools{flex:none;display:flex;gap:6px;padding:4px 8px;justify-content:center}
.tools .btn{min-width:0;flex:1;max-width:60px;height:44px;font-size:24px;padding:0}
.tabs .tab{height:46px}
.chip.txt{font-size:30px;font-weight:900;color:#ff6fa3}
.chip.lock .lv{position:absolute;bottom:-6px;right:-4px;background:#ffd34d;border-radius:12px;font-size:13px;padding:1px 7px;font-weight:800;color:#8a5a00}
</style>
</head>
<body>
<div id="app">

<!-- 홈 -->
<section id="s-home" class="screen active">
  <div class="bar"><button class="btn" id="muteBtn">🔊</button><button class="btn" id="profBtn"><canvas width="80" height="80" style="width:40px;height:40px"></canvas></button><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <h1 class="title">뽀짝 친구 마을</h1>
  <div class="hero"><canvas id="homeCv"></canvas></div>
  <div class="menu">
    <button class="mb" data-go="merge" style="background:linear-gradient(#ff9ec4,#ff6fa3)"><span class="ic">🍉</span><span class="lb">친구 합치기</span></button>
    <button class="mb" data-go="rhythm" style="background:linear-gradient(#a99bff,#7f6bff)"><span class="ic">🎵</span><span class="lb">리듬 놀이</span></button>
    <button class="mb" data-go="hangul" style="background:linear-gradient(#ffb36b,#ff8a3a)"><span class="ic">🔤</span><span class="lb">한글 놀이</span></button>
    <button class="mb" data-go="cake" style="background:linear-gradient(#ffd45e,#ffb300)"><span class="ic">🎂</span><span class="lb">케이크 꾸미기</span></button>
    <button class="mb" data-go="dress" style="background:linear-gradient(#ff9fd0,#ff70b5)"><span class="ic">👗</span><span class="lb">옷 입히기</span></button>
    <button class="mb" data-go="house" style="background:linear-gradient(#6fd6a0,#3cba7d)"><span class="ic">🏠</span><span class="lb">집 꾸미기</span></button>
    <button class="mb" data-go="egg" style="background:linear-gradient(#7fd3ff,#4aa8f0)"><span class="ic">🥚</span><span class="lb">알 뽑기</span></button>
    <button class="mb" data-go="book" style="background:linear-gradient(#ff8f8f,#f0615f)"><span class="ic">📖</span><span class="lb">친구 도감</span></button>
  </div>
</section>

<!-- 합치기 -->
<section id="s-merge" class="screen">
  <div class="bar"><button class="btn" data-back>⬅️</button><button class="btn" data-go="home">🏠</button><div class="pill">✨ <span id="mScore">0</span></div><div class="sp"></div><button class="btn" id="mRestart">🔄</button><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="stage"><canvas id="mergeCv"></canvas>
    <div class="ov" id="mOver"><div class="huge">🥺</div><div class="info">✨ <span id="mFinal">0</span> &nbsp; ⭐ +<span id="mGot">0</span></div><div class="row"><button class="btn big" id="mAgain">🔄</button><button class="btn big" data-go="home">🏠</button></div></div>
  </div>
</section>

<!-- 리듬 -->
<section id="s-rhythm" class="screen" style="background:linear-gradient(#d9ccff,#ffd9ec)">
  <div class="bar"><button class="btn" data-back>⬅️</button><button class="btn" data-go="home">🏠</button><div class="pill">✨ <span id="rScore">0</span></div><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="stage"><canvas id="rhythmCv"></canvas>
    <div class="ov" id="rSelect"><div class="info">🎵</div><div class="songs" id="rSongs"></div></div>
    <div class="ov" id="rResult"><div class="stars" id="rStars"></div><div class="info">✨ <span id="rFinal">0</span> &nbsp; ⭐ +<span id="rGot">0</span></div><div class="row"><button class="btn big" id="rAgain">🔄</button><button class="btn big" id="rMenu">🎵</button><button class="btn big" data-go="home">🏠</button></div></div>
  </div>
</section>

<!-- 옷 입히기 -->
<section id="s-dress" class="screen">
  <div class="bar"><button class="btn" data-back>⬅️</button><button class="btn" data-go="home">🏠</button><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="tray" id="dFriends" style="padding:6px 10px"></div>
  <div class="stage"><canvas id="dressCv"></canvas></div>
  <div class="tabs" id="dTabs"></div>
  <div class="tray" id="dTray"></div>
</section>

<!-- 집 꾸미기 -->
<section id="s-house" class="screen">
  <div class="bar"><button class="btn" data-back>⬅️</button><button class="btn" data-go="home">🏠</button><button class="btn" id="hTrash" hidden>🗑️</button><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="stage"><canvas id="houseCv"></canvas></div>
  <div class="tabs" id="hTabs"></div>
  <div class="tray" id="hTray"></div>
</section>

<!-- 알 뽑기 -->
<section id="s-egg" class="screen" style="background:linear-gradient(#d5f0ff,#fff0f8)">
  <div class="bar"><button class="btn" data-back>⬅️</button><button class="btn" data-go="home">🏠</button><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="stage"><canvas id="eggCv"></canvas></div>
  <div class="eggbar"><button class="btn big" id="eggBuy">🥚 ⭐15</button><button class="btn big" id="eggBook" hidden>📖</button></div>
</section>

<!-- 도감 -->
<section id="s-book" class="screen">
  <div class="bar"><button class="btn" data-back>⬅️</button><button class="btn" data-go="home">🏠</button><div class="pill">📖 <span id="bookN">0</span>/12</div><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="book" id="bookGrid"></div>
</section>

<!-- 프로필 -->
<section id="s-profile" class="screen">
  <div class="bar"><div class="sp"></div><div class="pill">누가 놀까요? 👇</div><div class="sp"></div></div>
  <div class="profwrap" id="profCards"></div>
</section>

<!-- 한글 놀이 -->
<section id="s-hangul" class="screen" style="background:linear-gradient(#fff6d9,#e8f5ff)">
  <div class="bar"><button class="btn" data-back>⬅️</button><button class="btn" data-go="home">🏠</button><div class="sp"></div><button class="btn" id="hgGear">⚙️</button><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="hub" id="hgHub"></div>
  <div class="quiz" id="hgQuiz" hidden>
    <div class="qtop"><div class="pill" id="qLv">Lv 1</div><div class="dots" id="qDots"></div></div>
    <div class="tbar" id="qTimer" hidden><i></i></div>
    <div class="qprompt" id="qPrompt"></div>
    <div class="qopts" id="qOpts"></div>
  </div>
  <div class="book" id="hgLearn" hidden></div>
  <div class="ov" id="hgStart"><div class="info">🌱 시작 레벨</div>
    <div class="row">
      <button class="btn lvb" data-lv="1">🌱<small>처음</small></button>
      <button class="btn lvb" data-lv="3">🌿<small>조금</small></button>
      <button class="btn lvb" data-lv="5">🌳<small>잘해요</small></button>
      <button class="btn lvb" data-lv="7">🌲<small>글 읽어요</small></button>
    </div>
    <button class="btn" id="hgStartX">✖</button></div>
</section>

<!-- 풍선 -->
<section id="s-balloon" class="screen" style="background:linear-gradient(#bfe8ff,#fff0f8)">
  <div class="bar"><button class="btn" data-back>⬅️</button><button class="btn" data-go="home">🏠</button><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="stage"><canvas id="balCv"></canvas></div>
</section>

<!-- 케이크 -->
<section id="s-cake" class="screen" style="background:linear-gradient(#fff0f6,#fff6e0)">
  <div class="bar"><button class="btn" data-back>⬅️</button><button class="btn" data-go="home">🏠</button><div class="pill">🎂 Lv <span id="ckLv">1</span></div><div class="sp"></div><button class="btn" id="ckGal">🖼️</button><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="stage"><canvas id="cakeCv"></canvas>
    <div class="ov" id="ckGallery"><div class="info">🖼️</div><div class="gal" id="galGrid"></div><div class="row"><button class="btn big" id="galClose">✖</button></div></div>
    <div class="ov" id="galView" style="z-index:8"><img id="galImg" alt="" style="width:min(80%,300px);border-radius:20px;border:5px solid #fff;box-shadow:0 6px 0 #e6cfe0"><div class="row"><button class="btn big" id="galDl">⬇️</button><button class="btn big" id="galDel">🗑️</button><button class="btn big" id="galX">✖</button></div></div>
  </div>
  <div class="tabs" id="ckTabs"></div>
  <div class="tools"><button class="btn" id="ckUndo">↩️</button><button class="btn" id="ckTrash">🗑️</button><button class="btn" id="ckFire">🔥</button><button class="btn" id="ckSave">⬇️</button><button class="btn" id="ckNew">🆕</button><button class="btn" id="ckDone" style="max-width:76px;background:#ffe27a">✅</button></div>
  <div class="tray" id="ckTray"></div>
</section>

<!-- 레벨업 -->
<div class="ov" id="lvOv"><div class="huge bounce">🎉</div><div class="lvbig" id="lvTitle">LEVEL UP!</div><div class="lvnum" id="lvNum">Lv 2</div><div class="info" id="lvGot"></div><div class="huge" style="font-size:48px">👆</div></div>

</div>
<script>
'use strict';
/* ================= 공통 도구 ================= */
const TAU=Math.PI*2,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const EMO='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const KO='"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const EGG_COST=15;

/* ---- 저장 (아이 2명 프로필) ---- */
const SAVE_KEY='ppojjak-village-v1',SAVE2='ppojjak-village-v2';
let ROOT=null,S=null;
function defState(){return{coins:40,unlocked:[0,1,2],active:1,outfits:{},owned:['bed','toy','plant'],
  house:{items:[{id:'bed',x:95,y:370},{id:'plant',x:305,y:300}],wall:0,floor:0},bestMerge:0,mute:false,songStars:{},
  hg:{a:1,b:1,c:1,d:1,started:false,learned:['가','나','다']},cake:{count:0,saved:[],cur:null}}}
function fixState(o){
  const d=defState(),s=Object.assign(d,(o&&typeof o==='object')?o:{});
  if(!s.house||!Array.isArray(s.house.items))s.house=defState().house;
  s.hg=Object.assign(defState().hg,s.hg||{});if(!Array.isArray(s.hg.learned))s.hg.learned=['가','나','다'];
  s.cake=Object.assign(defState().cake,s.cake||{});if(!Array.isArray(s.cake.saved))s.cake.saved=[];
  if(!s.songStars||typeof s.songStars!=='object')s.songStars={};
  if(!s.outfits||typeof s.outfits!=='object')s.outfits={};
  return s;

const ALLCV=[];
class Cv{
  constructor(id,lw,lh){this.c=$(id);this.lw=lw;this.lh=lh;this.x=this.c.getContext('2d');this.k=1;ALLCV.push(this)}
  fit(){
    const r=this.c.parentElement.getBoundingClientRect();if(r.width<20||r.height<20)return;
    const s=Math.min(r.width/this.lw,r.height/this.lh),d=Math.min(window.devicePixelRatio||1,2.5);
    this.c.style.width=this.lw*s+'px';this.c.style.height=this.lh*s+'px';
    this.c.width=Math.round(this.lw*s*d);this.c.height=Math.round(this.lh*s*d);this.k=s*d;
  }
  begin(){const c=this.x;c.setTransform(this.k,0,0,this.k,0,0);c.clearRect(0,0,this.lw,this.lh);return c}
  pt(e){const r=this.c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*this.lw,y:(e.clientY-r.top)/r.height*this.lh}}
}

const R=[14,19,25,32,40,49,59,70,82,95];
const MG={L:10,Rt:350,F:600,DANGER:135,SPAWN:75,balls:[],cur:0,next:0,dropX:180,holdX:180,cool:0,score:0,over:false,danger:0,fx:new FX(),banner:null,down:false,got:0,nid:0,acc:0};
const mRand=()=>pick([0,0,0,1,1,2,2,3]);
function mReset(){
  MG.balls=[];MG.score=0;MG.over=false;MG.danger=0;MG.cool=.4;MG.cur=mRand();MG.next=mRand();MG.banner=null;MG.fx.a=[];MG.got=0;
  $('#mOver').classList.remove('show');$('#mScore').textContent=0;
}
function mSetX(e){const p=MG.cv.pt(e);MG.dropX=clamp(p.x,MG.L+R[MG.cur],MG.Rt-R[MG.cur])}
function mDrop(){
  if(MG.over||MG.cool>0)return;
  const r=R[MG.cur];
  MG.balls.push({id:++MG.nid,x:clamp(MG.dropX,MG.L+r,MG.Rt-r),y:MG.SPAWN,vx:0,vy:0,l:MG.cur,r,age:0,pop:0});
  MG.cur=MG.next;MG.next=mRand();MG.cool=.55;sfx.drop();
}
function mFinish(){
  MG.over=true;sfx.over();
  if(MG.score>S.bestMerge)S.bestMerge=MG.score;save();
  $('#mFinal').textContent=MG.score;$('#mGot').textContent=MG.got;$('#mOver').classList.add('show');
}
function mMerge(a,b){
  a.dead=b.dead=true;
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,l=a.l;
  MG.score+=(l+1)*(l+2)/2;$('#mScore').textContent=MG.score;
  if(l>=R.length-1){
    MG.got+=10;addCoins(10);sfx.win();MG.fx.add('🌈',mx,my,6,200);MG.fx.add('⭐',mx,my,8,260);MG.fx.text('+10⭐',mx,my-30);MG.score+=60;return;
  }
  const g=l<5?1:l<8?2:4;MG.got+=g;addCoins(g);
  const nl=l+1;
  MG.balls.push({id:++MG.nid,x:mx,y:my,vx:(a.vx+b.vx)/2,vy:(a.vy+b.vy)/2-40,l:nl,r:R[nl],age:3,pop:1});
  sfx.merge(l);MG.fx.add('✨',mx,my,4,140);MG.fx.text('+'+g,mx,my-R[nl]-8);
  if(!S.unlocked.includes(nl)){S.unlocked.push(nl);save();MG.banner={sp:nl,t:2.6};speak(SP[nl].n)}
}
function mStep(h){
  const B=MG.balls;
  const wall=b=>{
    if(b.x<MG.L+b.r){b.x=MG.L+b.r;if(b.vx<0)b.vx*=-.1}
    if(b.x>MG.Rt-b.r){b.x=MG.Rt-b.r;if(b.vx>0)b.vx*=-.1}
    if(b.y>MG.F-b.r){b.y=MG.F-b.r;if(b.vy>0)b.vy*=-.1;b.vx*=.985}
  };
  for(const b of B){b.vy+=1500*h;b.x+=b.vx*h;b.y+=b.vy*h;b.age+=h;b.vx*=.9985;b.vy*=.9985;wall(b)}
  const merges=[];
  for(let it=0;it<4;it++){
    for(let i=0;i<B.length;i++){
      const a=B[i];
      for(let j=i+1;j<B.length;j++){
        const b=B[j],dx=b.x-a.x,dy=b.y-a.y,md=a.r+b.r;
        if(dx>md||dx<-md||dy>md||dy<-md)continue;
        const d2=dx*dx+dy*dy;if(d2>=md*md)continue;
        const d=Math.sqrt(d2)||.001,nx=dx/d,ny=dy/d,ov=md-d;
        if(it===0&&a.l===b.l)merges.push([a,b]);
        const ma=a.r*a.r,mb=b.r*b.r,t=ma+mb;
        a.x-=nx*ov*mb/t;a.y-=ny*ov*mb/t;b.x+=nx*ov*ma/t;b.y+=ny*ov*ma/t;
        const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(vn<0){const j2=-1.05*vn/(1/ma+1/mb);a.vx-=j2*nx/ma;a.vy-=j2*ny/ma;b.vx+=j2*nx/mb;b.vy+=j2*ny/mb}
      }
    }
    for(const b of B)wall(b);
  }
  for(const [a,b] of merges){if(!a.dead&&!b.dead)mMerge(a,b)}
  if(merges.length)MG.balls=MG.balls.filter(b=>!b.dead);
}
screens.merge={

    let any=false;for(const b of MG.balls)if(b.age>1.4&&b.y-b.r<MG.DANGER&&Math.abs(b.vy)<150)any=true;

    if(!MG.over){const k=clamp(1-MG.cool/.55,0,1);drawCritter(c,MG.holdX,MG.SPAWN,R[MG.cur]*k,SP[MG.cur],{t:T})}

    c.fillStyle='rgba(255,255,255,.85)';c.strokeStyle='#ffc2dc';c.lineWidth=4;c.beginPath();c.arc(318,52,36,0,TAU);c.fill();c.stroke();

    c.font='16px '+EMO;c.textAlign='center';c.fillText('▶',284,20);
    MG.fx.draw(c);
    if(MG.banner){
      const t=MG.banner.t,e=Math.min(1,(2.6-t)*3.5),sc=e<1?1+Math.sin(e*Math.PI)*.15:1,al=clamp(t*2,0,1);
      c.globalAlpha=al;c.fillStyle='rgba(255,255,255,.93)';c.strokeStyle='#ffb347';c.lineWidth=6;c.beginPath();c.roundRect?c.roundRect(40,230,280,210,30):c.rect(40,230,280,210);c.fill();c.stroke();
      c.font='900 26px '+KO;c.textAlign='center';c.fillStyle='#ff8a1f';c.fillText('✨ 새 친구! ✨',180,262);
      drawCritter(c,180,348,56*sc,SP[MG.banner.sp],{t:T,mood:'open'});

function rStart(i){
  RH.song=i;const sg=SONGS[i];RH.spb=60/sg.bpm;RH.notes=[];let beat=0;startBus();
  sg.n.split(' ').forEach(tk=>{
    const m=tk.match(/^([A-G])('?)([\d.]+)$/);if(!m)return;
    const f=NOTE_F[m[1]]*(m[2]?2:1),d=parseFloat(m[3]);
    RH.notes.push({time:RH.LEAD+beat*RH.spb,f,lane:0,hit:false,miss:false,d});
    tone(f,Math.min(.5,d*RH.spb*.9),'sine',.05,RH.LEAD+beat*RH.spb);
    beat+=d;
  });
  /* 낮은 음 → 왼쪽 칸, 높은 음 → 오른쪽 칸 */
  const u=[...new Set(RH.notes.map(n=>n.f))].sort((a,b)=>a-b),k=u.length;
  for(const n of RH.notes){
    const r=u.indexOf(n.f);

    n.sp=LANE_SP[n.lane];
  }

function rTap(l){
  if(RH.state!=='play')return;
  RH.fl[l]=1;const now=rNow();let best=null,bd=9;
  for(const n of RH.notes){if(n.lane!==l||n.hit||n.miss)continue;const d=Math.abs(n.time-now);if(d<=RH.WIN&&d<bd){best=n;bd=d}}
  const x=LW/2+l*LW,tx=clamp(x,62,298);
  if(best){
    best.hit=true;RH.combo++;RH.hits++;const perfect=bd<.13;
    RH.score+=perfect?20:10;$('#rScore').textContent=RH.score;
    tone(best.f,.4,'triangle',.22);RH.hop=1;
    RH.fx.add(perfect?'✨':'💖',x,RH.HITY,perfect?7:4,170);

  }

function hBuildTabs(){
  const box=$('#hTabs');box.innerHTML='';
  [['furn','🛋️'],['decor','🎨']].forEach(([k,e])=>{const b=document.createElement('button');b.className='tab'+(HS.tab===k?' sel':'');b.textContent=e;b.onclick=()=>{HS.tab=k;sfx.tap();hBuildTabs();hBuildTray()};box.appendChild(b)});

function hBuildTray(){
  const box=$('#hTray');box.innerHTML='';
  if(HS.tab==='furn'){
    FURN.forEach(f=>{
      const own=S.owned.includes(f.id),b=document.createElement('button');b.className='chip'+(own?'':' lock');
      b.innerHTML='<span class="e">'+f.e+'</span>'+(own?'':'<span class="price">⭐'+f.p+'</span>');
      b.onclick=()=>{
        if(own){hAdd(f.id)}
        else if(S.coins>=f.p){S.coins-=f.p;S.owned.push(f.id);save();updateCoins();sfx.coin();HS.fx.add('✨',180,250,8,200);hBuildTray()}
        else{sfx.no();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
      };
      box.appendChild(b);
    });
  }else{
    const mk=(col,key,i)=>{const b=document.createElement('button');b.className='chip sw'+(S.house[key]===i?' sel':'');b.style.background=col;b.onclick=()=>{S.house[key]=i;save();sfx.pop();hBuildTray()};box.appendChild(b)};

function hAdd(id){
  S.house.items.push({id,x:rand(110,250),y:FMAP[id].e&&['🖼️','🪟','🕰️'].includes(FMAP[id].e)?rand(70,150):rand(290,400)});
  HS.sel=S.house.items.length-1;$('#hTrash').hidden=false;save();sfx.pop();
}
function hHit(p){
  const I=S.house.items;
  for(let i=I.length-1;i>=0;i--){const it=I[i],f=FMAP[it.id];if(!f)continue;if(Math.abs(p.x-it.x)<f.s*.55&&Math.abs(p.y-it.y)<f.s*.55)return i}
  return -1;
}
screens.house={
  enter(){HS.sel=-1;HS.drag=null;$('#hTrash').hidden=true;hBuildTabs();hBuildTray()},
  leave(){save()},
  update(dt){
    HS.fx.up(dt);const F=HS.F;F.hop=Math.max(0,F.hop-dt*2.2);
    F.w-=dt;
    if(F.w<=0){F.tx=rand(40,320);F.ty=rand(270,440);F.w=rand(2,5)}
    const dx=F.tx-F.x,dy=F.ty-F.y,d=Math.hypot(dx,dy);
    if(d>3){F.x+=dx/d*45*dt;F.y+=dy/d*45*dt;F.moving=true}else F.moving=false;
  },
  draw(){
    const c=HS.cv.begin(),W=360,H=480,wc=WALLS[S.house.wall]||WALLS[0],fc=FLOORS[S.house.floor]||FLOORS[0];
    c.fillStyle=wc;c.fillRect(0,0,W,232);
    c.fillStyle='rgba(255,255,255,.4)';for(let y=14;y<220;y+=34)for(let x=(y/34%2)*17+10;x<W;x+=34){c.beginPath();c.arc(x,y,5,0,TAU);c.fill()}
    c.fillStyle='rgba(0,0,0,.08)';c.fillRect(0,222,W,12);
    c.fillStyle=fc;c.fillRect(0,234,W,H-234);
    c.strokeStyle='rgba(0,0,0,.07)';c.lineWidth=2;for(let y=262;y<H;y+=34){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
    const list=S.house.items.map((it,i)=>({it,i,y:it.y})).filter(o=>FMAP[o.it.id]);
    const F=HS.F;list.push({fr:true,y:F.y});list.sort((a,b)=>a.y-b.y);
    c.textAlign='center';c.textBaseline='middle';
    for(const o of list){
      if(o.fr){
        const r=26+(F.y-230)/230*16,hop=Math.sin(F.hop*Math.PI)*26,wob=F.moving?Math.abs(Math.sin(T*9))*6:Math.abs(Math.sin(T*2))*2;
        shadow(c,F.x,F.y+r*.95,r*.8);drawCritter(c,F.x,F.y-wob-hop,r,SP[S.active]||SP[0],{outfit:outfitOf(S.active),t:T,mood:F.hop>0?'open':null,rot:F.moving?Math.sin(T*9)*.06:0});continue;
      }
      const it=o.it,f=FMAP[it.id];
      if(!['🖼️','🪟','🕰️'].includes(f.e))ell(c,it.x,it.y+f.s*.4,f.s*.38,f.s*.09,'rgba(0,0,0,.09)');

    }
    HS.fx.draw(c);
  }
};

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const scode=ch=>ch.charCodeAt(0)-0xAC00,scho=ch=>Math.floor(scode(ch)/588),sjung=ch=>Math.floor((scode(ch)%588)/28);
const compose=(a,b,c)=>String.fromCharCode(0xAC00+(a*21+b)*28+(c||0));
WORDS.forEach(x=>{x.f=x.w[0];x.t=BASIC.includes(x.f)?0:(scode(x.f)%28!==0?2:1)});
function distract(ans,U,n,sim){
  const others=U.filter(c=>c!==ans),out=[];
  if(sim){const m=others.filter(c=>scho(c)===scho(ans)||sjung(c)===sjung(ans));if(m.length)out.push(pick(m))}
  const rest=shuffle(others.filter(c=>!out.includes(c)));
  while(out.length<n-1&&rest.length)out.push(rest.pop());
  return shuffle([ans,...out]);
}

/* A. 첫 글자 찾기 (가~하 전부 + 단계별 확장) */
const NA=[2,3,3,4,4,3,4,5,4,5];
function qA(){
  const L=S.hg.a;let pool;
  if(L<=5)pool=WORDS.filter(x=>x.t===0);else if(L===6)pool=WORDS.filter(x=>x.t<=1);
  else pool=Math.random()<.5?WORDS.filter(x=>x.t===2):WORDS.filter(x=>x.t<=1);
  const w=pick(pool),ans=w.f,U=L<=5?[...BASIC]:[...new Set(WORDS.map(x=>x.f))];
  const opts=distract(ans,U,NA[L-1],L>=3);
  const showText=L<=2||L>=9,showPic=L!==5&&L<9,voice=L<9;
  let html='';
  if(showPic)html+='<div class="pic">'+w.e+'</div>';else if(L===5)html+='<div class="pic">🎧</div>';
  if(showText)html+='<div class="wtxt">'+w.w+'</div>';
  if(voice)html+='<button class="say" id="qSay">🔊</button>';

function ckHit(p){
  const I=CK.K.items;
  for(let i=I.length-1;i>=0;i--){
    const it=I[i];
    if(it.t==='c'){if(Math.abs(p.x-it.x)<16&&p.y>it.y-62&&p.y<it.y+8)return i}
    else if(Math.abs(p.x-it.x)<(it.s||44)*.6&&Math.abs(p.y-it.y)<(it.s||44)*.6)return i;
  }
  return -1;
}
function ckThumb(){
  const cv=document.createElement('canvas');cv.width=240;cv.height=280;const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,0,280);g.addColorStop(0,'#fff0f6');g.addColorStop(1,'#fff6e0');c.fillStyle=g;c.fillRect(0,0,240,280);
  c.scale(240/360,280/420);const lit=CK.K.lit;CK.K.lit=false;drawCake(c,CK.K,{});CK.K.lit=lit;
  return cv.toDataURL('image/jpeg',.82);
}
function ckDownload(href){const a=document.createElement('a');a.href=href;a.download='cake.png';document.body.appendChild(a);a.click();a.remove()}
function ckGalleryBuild(){
  const g=$('#galGrid');g.innerHTML='';
  S.cake.saved.forEach((u,i)=>{const im=document.createElement('img');im.src=u;im.alt='';im.onclick=()=>{CK.gv=i;$('#galImg').src=u;$('#galView').classList.add('show')};g.appendChild(im)});
  if(!S.cake.saved.length)g.innerHTML='<div style="grid-column:span 3;font-size:56px;text-align:center">🎂❓</div>';
}
function ckPlayTune(){
  const a=ac();if(!a||S.mute)return;startBus();const sg=SONGS[4],spb=60/sg.bpm;let beat=0;
  sg.n.split(' ').forEach(tk=>{const m=tk.match(/^([A-G])('?)([\d.]+)$/);if(!m)return;const f=NOTE_F[m[1]]*(m[2]?2:1),d=parseFloat(m[3]);tone(f,Math.min(.6,d*spb*.95),'triangle',.13,.1+beat*spb);beat+=d});
}
function ckFinish(){
  const K=CK.K;if(!K.items.length&&!K.strokes.length){sfx.no();return}
  const before=ckLv();S.cake.saved.unshift(ckThumb());S.cake.saved=S.cake.saved.slice(0,6);S.cake.count++;addCoins(5);
  CK.K=S.cake.cur=ckNewK();CK.sel=-1;CK.hist=[];save();ckBuildTray();$('#ckLv').textContent=ckLv();
  const after=ckLv(),open=()=>{ckGalleryBuild();$('#ckGallery').classList.add('show')};
  if(after>before)showLevelUp('새 토핑 열림!','Lv '+after,5,open);else{sfx.win();open()}
}
screens.cake={
  enter(){
    if(!S.cake.cur||!S.cake.cur.items)S.cake.cur=ckNewK();
    CK.K=S.cake.cur;CK.K.lit=false;CK.sel=-1;CK.hist=[];CK.drag=null;CK.drawing=null;
    $('#ckGallery').classList.remove('show');$('#galView').classList.remove('show');
    $('#ckLv').textContent=ckLv();ckBuildTabs();ckBuildTray();
  },
  leave(){stopBus();if(CK.K){CK.K.lit=false;ckSave()}},
  back(){if($('#galView').classList.contains('show')){$('#galView').classList.remove('show');return true}if($('#ckGallery').classList.contains('show')){$('#ckGallery').classList.remove('show');return true}return false},
  update(dt){CK.fx.up(dt);if(CK.K&&CK.K.lit){CK.fxT-=dt;if(CK.fxT<=0){CK.fxT=.5;CK.fx.add(pick(['🎉','✨','🎊','⭐']),rand(40,320),380,2,160)}}},
  draw(){
    const c=CK.cv.begin();bg(c,360,420,'#fff0f6','#fff6e0');
    for(let i=0;i<7;i++){c.globalAlpha=.5;c.font='20px '+EMO;c.textAlign='center';c.fillText(['✨','💖','⭐'][i%3],30+i*50,26+Math.sin(T*1.2+i)*8)}c.globalAlpha=1;
    drawCake(c,CK.K,{main:1});
    if(CK.K.lit){const b=bounce(T,5);shadow(c,50,402,28);drawCritter(c,50,372+b.dy*.6,30,SP[S.active]||SP[0],{outfit:outfitOf(S.active),t:T,mood:'open',sx:b.sx,sy:b.sy})}
    CK.fx.draw(c);
  }
};

/* ================= 입력 연결 (v2.1+) ================= */
function wire2(){
  $$('[data-back]').forEach(b=>b.addEventListener('click',()=>{sfx.tap();uiBack()}));
  $('#profBtn').onclick=()=>{ac();sfx.tap();go('profile')};
  $('#muteBtn').onclick=()=>{const m=!S.mute;ROOT.p.forEach(p=>p.mute=m);save();$('#muteBtn').textContent=m?'🔇':'🔊';if(!m){ac();sfx.tap()}};
  /* 한글 */
  $('#hgGear').onclick=()=>{sfx.tap();$('#hgStart').classList.add('show')};
  $('#hgStartX').onclick=()=>{S.hg.started=true;save();$('#hgStart').classList.remove('show')};
  $$('#hgStart [data-lv]').forEach(b=>b.onclick=()=>{
    const v=+b.dataset.lv;S.hg.a=Math.min(v,MAXL.a);S.hg.b=Math.min(v,MAXL.b);S.hg.c=Math.min(v,MAXL.c);S.hg.d=Math.min(v,MAXL.d);S.hg.started=true;save();sfx.win();
    $('#hgStart').classList.remove('show');hgBuildHub();
  });
  BL.cv.c.addEventListener('pointerdown',e=>{ac();bTap(BL.cv.pt(e))});
  /* 케이크 */
  const cc=CK.cv.c;
  cc.addEventListener('pointerdown',e=>{
    ac();const p=CK.cv.pt(e);cc.setPointerCapture(e.pointerId);
    if(CK.tab==='cream'){
      const g=cakeGeom(CK.K);
      if(p.x>50&&p.x<310&&p.y>g.topY-26&&p.y<340){const s={c:CREAM[CK.K.cream],w:12,pts:[[p.x,p.y]]};CK.K.strokes.push(s);CK.drawing=s}
      return;
    }
    const i=ckHit(p);
    if(i>=0){const it=CK.K.items[i];CK.drag={dx:it.x-p.x,dy:it.y-p.y,sx:p.x,sy:p.y,moved:false,was:CK.sel===i};CK.sel=i}else CK.sel=-1;
  });
  cc.addEventListener('pointermove',e=>{
    const p=CK.cv.pt(e);
    if(CK.drawing){const l=CK.drawing.pts[CK.drawing.pts.length-1];if(Math.hypot(p.x-l[0],p.y-l[1])>3)CK.drawing.pts.push([p.x,p.y])}
    else if(CK.drag&&CK.sel>=0){const it=CK.K.items[CK.sel];if(Math.hypot(p.x-CK.drag.sx,p.y-CK.drag.sy)>6)CK.drag.moved=true;it.x=clamp(p.x+CK.drag.dx,20,340);it.y=clamp(p.y+CK.drag.dy,40,400)}
  });
  const up=()=>{
    if(CK.drawing){CK.drawing=null;CK.hist.push('s');ckSave()}
    if(CK.drag){const it=CK.K.items[CK.sel];if(it&&!CK.drag.moved&&CK.drag.was&&it.t!=='c'){const z=it.t==='f'?[56,68,84,100]:[34,44,58,74];it.s=z[(z.indexOf(it.s)+1)%z.length]||z[1]}CK.drag=null;ckSave()}
  };
  cc.addEventListener('pointerup',up);cc.addEventListener('pointercancel',up);
  $('#ckUndo').onclick=()=>{const h=CK.hist.pop();if(h==='s')CK.K.strokes.pop();else if(h==='i'){CK.K.items.pop();CK.sel=-1}else{sfx.no();return}sfx.tap();ckSave()};
  $('#ckTrash').onclick=()=>{if(CK.sel>=0){CK.K.items.splice(CK.sel,1);CK.sel=-1;sfx.no();ckSave()}};
  $('#ckFire').onclick=()=>{
    const K=CK.K;if(K.lit){K.lit=false;stopBus();CK.fx.add('💨',180,150,5,120);sfx.tap();return}
    if(!K.items.some(i=>i.t==='c')){sfx.no();CK.tab='can';ckBuildTabs();ckBuildTray();return}
    K.lit=true;ckPlayTune();
  };
  $('#ckSave').onclick=()=>{
    const cv=document.createElement('canvas');cv.width=720;cv.height=840;const c=cv.getContext('2d');
    const g=c.createLinearGradient(0,0,0,840);g.addColorStop(0,'#fff0f6');g.addColorStop(1,'#fff6e0');c.fillStyle=g;c.fillRect(0,0,720,840);
    c.scale(2,2);const lit=CK.K.lit;CK.K.lit=false;drawCake(c,CK.K,{});CK.K.lit=lit;
    cv.toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b);ckDownload(u);setTimeout(()=>URL.revokeObjectURL(u),3000)});
  };
  $('#ckNew').onclick=()=>{
    if(!CK.armNew){CK.armNew=1;$('#ckNew').textContent='❓';sfx.tap();setTimeout(()=>{CK.armNew=0;$('#ckNew').textContent='🆕'},2200);return}
    CK.armNew=0;$('#ckNew').textContent='🆕';CK.K=S.cake.cur=ckNewK();CK.sel=-1;CK.hist=[];ckSave();ckBuildTray();sfx.no();
  };
  $('#ckDone').onclick=ckFinish;
  $('#ckGal').onclick=()=>{sfx.tap();ckGalleryBuild();$('#ckGallery').classList.add('show')};
  $('#galClose').onclick=()=>$('#ckGallery').classList.remove('show');
  $('#galX').onclick=()=>$('#galView').classList.remove('show');
  $('#galDl').onclick=()=>ckDownload($('#galImg').src);
  $('#galDel').onclick=()=>{if(CK.gv>=0){S.cake.saved.splice(CK.gv,1);save();CK.gv=-1;$('#galView').classList.remove('show');ckGalleryBuild()}};
  /* 리듬 뒤로가기: 연주 중 → 곡 선택 */
  screens.rhythm.back=()=>{
    if(RH.state==='play'||RH.state==='result'){stopBus();RH.state='select';rBuildSelect();$('#rResult').classList.remove('show');$('#rSelect').classList.add('show');return true}
    return false;
  };
  const rl=screens.rhythm.leave;screens.rhythm.leave=()=>{stopBus();RH.state='select';if(rl)rl()};
}

/* ================= 입력 연결 & 시작 ================= */
function wire(){
  /* 메뉴 이동 */
  $$('[data-go]').forEach(b=>b.addEventListener('click',()=>{ac();sfx.tap();go(b.dataset.go)}));
  $('#muteBtn').onclick=()=>{S.mute=!S.mute;save();$('#muteBtn').textContent=S.mute?'🔇':'🔊';if(!S.mute){ac();sfx.tap()}};
  /* 홈 */
  HM.cv.c.addEventListener('pointerdown',e=>{const p=HM.cv.pt(e);HM.hop=1;sfx.pop();HM.fx.add('💖',p.x,p.y,6,150);speak(SP[S.active].n)});
  /* 합치기 */
  const mc=MG.cv.c;
  mc.addEventListener('pointerdown',e=>{ac();MG.down=true;mc.setPointerCapture(e.pointerId);mSetX(e)});
  mc.addEventListener('pointermove',e=>{if(MG.down||e.pointerType==='mouse')mSetX(e)});
  mc.addEventListener('pointerup',e=>{if(MG.down){MG.down=false;mSetX(e);mDrop()}});
  mc.addEventListener('pointercancel',()=>{MG.down=false});
  $('#mRestart').onclick=()=>{sfx.tap();mReset()};$('#mAgain').onclick=()=>{sfx.tap();mReset()};
  /* 리듬 */
  RH.cv.c.addEventListener('pointerdown',e=>{ac();const p=RH.cv.pt(e);rTap(clamp(Math.floor(p.x/LW),0,NLANE-1))});
  $('#rAgain').onclick=()=>rStart(RH.song);
  $('#rMenu').onclick=()=>{RH.state='select';rBuildSelect();$('#rResult').classList.remove('show');$('#rSelect').classList.add('show')};
  window.addEventListener('keydown',e=>{
    if(cur==='rhythm'){const k={a:0,'1':0,s:1,'2':1,d:2,'3':2,f:3,'4':3,g:4,'5':4,ArrowLeft:0,ArrowDown:2,ArrowRight:4}[e.key];if(k!=null)rTap(k)}
    if(cur==='merge'&&(e.key===' '||e.key==='ArrowDown')){e.preventDefault();mDrop()}
    if(cur==='merge'){if(e.key==='ArrowLeft')MG.dropX=clamp(MG.dropX-20,MG.L+R[MG.cur],MG.Rt-R[MG.cur]);if(e.key==='ArrowRight')MG.dropX=clamp(MG.dropX+20,MG.L+R[MG.cur],MG.Rt-R[MG.cur])}
  });
  /* 옷 입히기 */
  DR.cv.c.addEventListener('pointerdown',e=>{ac();const p=DR.cv.pt(e);DR.hop=1;sfx.pop();DR.fx.add('💖',p.x,p.y,6,150);speak(SP[DR.id].n)});
  /* 집 */
  const hc=HS.cv.c;
  hc.addEventListener('pointerdown',e=>{
    ac();const p=HS.cv.pt(e),i=hHit(p);
    if(i>=0){HS.sel=i;HS.drag={dx:S.house.items[i].x-p.x,dy:S.house.items[i].y-p.y};hc.setPointerCapture(e.pointerId);$('#hTrash').hidden=false;sfx.tap()}
    else{
      HS.sel=-1;$('#hTrash').hidden=true;
      const F=HS.F,r=26+(F.y-230)/230*16;
      if(Math.hypot(p.x-F.x,p.y-F.y)<r*1.2){F.hop=1;sfx.pop();HS.fx.add('💖',F.x,F.y-r,5,140);speak(SP[S.active].n)}
    }
  });
  hc.addEventListener('pointermove',e=>{if(!HS.drag||HS.sel<0)return;const p=HS.cv.pt(e),it=S.house.items[HS.sel];it.x=clamp(p.x+HS.drag.dx,20,340);it.y=clamp(p.y+HS.drag.dy,30,460)});
  const endDrag=()=>{if(HS.drag){HS.drag=null;save()}};
  hc.addEventListener('pointerup',endDrag);hc.addEventListener('pointercancel',endDrag);
  $('#hTrash').onclick=()=>{if(HS.sel>=0){S.house.items.splice(HS.sel,1);HS.sel=-1;$('#hTrash').hidden=true;save();sfx.no()}};
  /* 알 */
  $('#eggBuy').onclick=()=>{
    ac();
    if(S.coins<EGG_COST){sfx.no();const b=$('#eggBuy');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
    S.coins-=EGG_COST;save();updateCoins();EG.state='tap';EG.taps=0;EG.t=0;EG.wob=0;sfx.tap();eggUI();
  };
  $('#eggBook').onclick=()=>{sfx.tap();go('book')};
  EG.cv.c.addEventListener('pointerdown',e=>{
    ac();if(EG.state!=='tap')return;
    EG.taps++;EG.wob=1;EG.t=0;sfx.pop();const p=EG.cv.pt(e);EG.fx.add('✨',p.x,p.y,4,160);
    if(EG.taps>=3){
      EG.sp=eggPick();EG.isNew=!S.unlocked.includes(EG.sp);
      if(EG.isNew)S.unlocked.push(EG.sp);else S.coins+=5;
      save();updateCoins();EG.state='hatch';EG.t=0;eggUI();
    }
  });
  document.addEventListener('pointerdown',()=>ac(),{once:true});
}

load();
HM.cv=new Cv('#homeCv',360,200);MG.cv=new Cv('#mergeCv',360,620);RH.cv=new Cv('#rhythmCv',360,600);
DR.cv=new Cv('#dressCv',360,400);HS.cv=new Cv('#houseCv',360,480);EG.cv=new Cv('#eggCv',360,440);
BL.cv=new Cv('#balCv',360,600);CK.cv=new Cv('#cakeCv',360,420);
wire();wire2();updateCoins();go('profile',{nopush:true});refit();setTimeout(refit,80);
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}))}
window.__game={S:()=>S,MG,RH,EG,HS,go,mDrop,rTap,SP};
</script>
