<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>뽀짝 친구 마을</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff8fb8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--ink:#6a4a7a;--pink:#ff8fb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Jua","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:#ffeef6;color:var(--ink);touch-action:manipulation}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:linear-gradient(#ffe9f3,#e6f3ff)}
.screen.active{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:none;height:64px}
.sp{flex:1}
.btn{border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #e6cfe0;font-size:28px;min-width:54px;height:48px;padding:0 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e6cfe0}
.btn.big{font-size:46px;min-width:100px;height:84px;border-radius:26px}
.btn[hidden]{display:none}
.coins,.pill{background:#fff7d6;border-radius:22px;padding:6px 14px;font-size:22px;font-weight:800;box-shadow:0 4px 0 #f0dc9c;color:#b07a00;white-space:nowrap}
.pill{background:#fff;box-shadow:0 4px 0 #e6cfe0;color:var(--ink)}
.stage{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
canvas{display:block;touch-action:none}
.tray{flex:none;display:flex;gap:10px;overflow-x:auto;padding:10px 12px 14px;background:rgba(255,255,255,.7);border-top:3px solid #fff}
.tabs{flex:none;display:flex;gap:6px;padding:6px 8px;justify-content:center}
.tab{font-size:24px;flex:1;max-width:58px;min-width:0;padding:0;height:50px;border-radius:18px;border:3px solid transparent;background:#fff;box-shadow:0 3px 0 #e6cfe0;cursor:pointer}
.tab.sel{border-color:var(--pink);background:#fff0f6}
.chip{flex:none;width:72px;height:72px;border-radius:20px;border:4px solid #fff;background:#fff;box-shadow:0 4px 0 #e6cfe0;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative;cursor:pointer;padding:0}
.chip canvas{width:64px;height:64px}
.chip.sel{border-color:var(--pink);background:#fff0f6}
.chip.lock span.e{opacity:.45;filter:grayscale(.7)}
.chip .price{position:absolute;bottom:-6px;right:-4px;background:#ffd34d;border-radius:12px;font-size:14px;padding:1px 7px;font-weight:800;color:#8a5a00;box-shadow:0 2px 0 #e0b000}
.chip.shake{animation:shake .35s}
.chip.sw{width:60px;height:60px;border-radius:50%}
.sep{flex:none;width:6px;border-radius:3px;background:#e8d6ee;margin:6px 2px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ov{position:absolute;inset:0;background:rgba(255,238,248,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5;text-align:center}
.ov.show{display:flex}
.ov .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.ov .huge{font-size:80px;line-height:1}
.ov .stars{font-size:56px;letter-spacing:6px}
.ov .stars .off{filter:grayscale(1);opacity:.3}
.ov .info{font-size:28px;font-weight:800}
.hero{flex:none;height:min(34vh,260px);display:flex;align-items:center;justify-content:center;min-height:0}
.title{font-size:clamp(28px,6vw,46px);font-weight:900;text-align:center;margin:0;color:#ff6fa3;text-shadow:0 3px 0 #fff,0 6px 0 #ffd6e7}
.menu{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:10px 16px 18px;max-width:640px;width:100%;margin:0 auto}
.mb{border:0;border-radius:28px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;color:#fff;font-weight:900;box-shadow:0 7px 0 rgba(0,0,0,.14);transition:transform .1s}
.mb:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.mb .ic{font-size:clamp(40px,9vh,70px);line-height:1}
.mb .lb{font-size:clamp(15px,2.6vh,22px);text-shadow:0 2px 0 rgba(0,0,0,.15)}
.book{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:8px 14px 20px;max-width:560px;width:100%;margin:0 auto;align-content:start}
.card{background:#fff;border-radius:24px;padding:8px 4px 8px;text-align:center;border:4px solid #fff;box-shadow:0 5px 0 #e6cfe0;cursor:pointer;position:relative}
.card canvas{width:100%;max-width:110px;height:auto;aspect-ratio:1}
.card .nm{font-size:18px;font-weight:800}
.card.act{border-color:var(--pink);background:#fff0f6}
.card.act::after{content:"💖";position:absolute;top:2px;right:6px;font-size:22px}
.card.hop{animation:hop .5s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) scale(1.06)}}
.eggbar{flex:none;display:flex;justify-content:center;align-items:center;gap:14px;padding:6px 10px 20px;min-height:100px}
</style>
</head>
<body>
<div id="app">

<!-- 홈 -->
<section id="s-home" class="screen active">
  <div class="bar"><button class="btn" id="muteBtn">🔊</button><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <h1 class="title">뽀짝 친구 마을</h1>
  <div class="hero"><canvas id="homeCv"></canvas></div>
  <div class="menu">
    <button class="mb" data-go="merge" style="background:linear-gradient(#ff9ec4,#ff6fa3)"><span class="ic">🍉</span><span class="lb">친구 합치기</span></button>
    <button class="mb" data-go="rhythm" style="background:linear-gradient(#a99bff,#7f6bff)"><span class="ic">🎵</span><span class="lb">리듬 놀이</span></button>
    <button class="mb" data-go="dress" style="background:linear-gradient(#ffc36b,#ff9f3a)"><span class="ic">👗</span><span class="lb">옷 입히기</span></button>
    <button class="mb" data-go="house" style="background:linear-gradient(#6fd6a0,#3cba7d)"><span class="ic">🏠</span><span class="lb">집 꾸미기</span></button>
    <button class="mb" data-go="egg" style="background:linear-gradient(#7fd3ff,#4aa8f0)"><span class="ic">🥚</span><span class="lb">알 뽑기</span></button>
    <button class="mb" data-go="book" style="background:linear-gradient(#ff8f8f,#f0615f)"><span class="ic">📖</span><span class="lb">친구 도감</span></button>
  </div>
</section>

<!-- 합치기 -->
<section id="s-merge" class="screen">
  <div class="bar"><button class="btn" data-go="home">🏠</button><div class="pill">✨ <span id="mScore">0</span></div><div class="sp"></div><button class="btn" id="mRestart">🔄</button><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="stage"><canvas id="mergeCv"></canvas>
    <div class="ov" id="mOver"><div class="huge">🥺</div><div class="info">✨ <span id="mFinal">0</span> &nbsp; ⭐ +<span id="mGot">0</span></div><div class="row"><button class="btn big" id="mAgain">🔄</button><button class="btn big" data-go="home">🏠</button></div></div>
  </div>
</section>

<!-- 리듬 -->
<section id="s-rhythm" class="screen" style="background:linear-gradient(#d9ccff,#ffd9ec)">
  <div class="bar"><button class="btn" data-go="home">🏠</button><div class="pill">✨ <span id="rScore">0</span></div><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="stage"><canvas id="rhythmCv"></canvas>
    <div class="ov" id="rSelect"><div class="info">🎵</div><div class="row" id="rSongs"></div></div>
    <div class="ov" id="rResult"><div class="stars" id="rStars"></div><div class="info">✨ <span id="rFinal">0</span> &nbsp; ⭐ +<span id="rGot">0</span></div><div class="row"><button class="btn big" id="rAgain">🔄</button><button class="btn big" id="rMenu">🎵</button><button class="btn big" data-go="home">🏠</button></div></div>
  </div>
</section>

<!-- 옷 입히기 -->
<section id="s-dress" class="screen">
  <div class="bar"><button class="btn" data-go="home">🏠</button><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="tray" id="dFriends" style="padding:6px 10px"></div>
  <div class="stage"><canvas id="dressCv"></canvas></div>
  <div class="tabs" id="dTabs"></div>
  <div class="tray" id="dTray"></div>
</section>

<!-- 집 꾸미기 -->
<section id="s-house" class="screen">
  <div class="bar"><button class="btn" data-go="home">🏠</button><button class="btn" id="hTrash" hidden>🗑️</button><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="stage"><canvas id="houseCv"></canvas></div>
  <div class="tabs" id="hTabs"></div>
  <div class="tray" id="hTray"></div>
</section>

<!-- 알 뽑기 -->
<section id="s-egg" class="screen" style="background:linear-gradient(#d5f0ff,#fff0f8)">
  <div class="bar"><button class="btn" data-go="home">🏠</button><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="stage"><canvas id="eggCv"></canvas></div>
  <div class="eggbar"><button class="btn big" id="eggBuy">🥚 ⭐15</button><button class="btn big" id="eggBook" hidden>📖</button></div>
</section>

<!-- 도감 -->
<section id="s-book" class="screen">
  <div class="bar"><button class="btn" data-go="home">🏠</button><div class="pill">📖 <span id="bookN">0</span>/12</div><div class="sp"></div><div class="coins">⭐ <span class="cn">0</span></div></div>
  <div class="book" id="bookGrid"></div>
</section>

</div>
<script>
'use strict';
/* ================= 공통 도구 ================= */
const TAU=Math.PI*2,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const EMO='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const KO='"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const EGG_COST=15;

/* ---- 저장 ---- */
const SAVE_KEY='ppojjak-village-v1';
let S=null;
function load(){
  let o=null;try{o=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){}
  const d={coins:40,unlocked:[0,1,2],active:1,outfits:{},owned:['bed','toy','plant'],
    house:{items:[{id:'bed',x:95,y:370},{id:'plant',x:305,y:300}],wall:0,floor:0},bestMerge:0,mute:false};
  S=Object.assign(d,(o&&typeof o==='object')?o:{});
  if(!S.house||!Array.isArray(S.house.items))S.house=d.house;
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function updateCoins(){$$('.cn').forEach(e=>e.textContent=S.coins)}
function addCoins(n){S.coins+=n;save();updateCoins()}

/* ---- 소리 ---- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,when){
  if(S.mute)return;const a=ac();if(!a)return;
  const t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1568,1760];
const sfx={
  tap(){tone(660,.08,'triangle',.1)},
  drop(){tone(240,.09,'triangle',.12)},
  merge(l){const f=PENTA[clamp(l,0,9)];tone(f,.26,'triangle',.2);tone(f*1.5,.22,'sine',.09,.07)},
  coin(){tone(988,.08,'square',.05);tone(1319,.16,'square',.05,.08)},
  no(){tone(180,.18,'sawtooth',.06)},
  pop(){tone(420,.1,'sine',.14);tone(640,.1,'sine',.1,.06)},
  hatch(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.16,i*.09))},
  over(){[392,330,262].forEach((f,i)=>tone(f,.3,'sine',.14,i*.18))},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.16,i*.12))}
};
function speak(t){
  if(S.mute)return;
  try{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.85;u.pitch=1.5;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}

/* ---- 캔버스 도우미 (논리 좌표계로 그리기) ---- */
const ALLCV=[];
class Cv{
  constructor(id,lw,lh){this.c=$(id);this.lw=lw;this.lh=lh;this.x=this.c.getContext('2d');this.k=1;ALLCV.push(this)}
  fit(){
    const r=this.c.parentElement.getBoundingClientRect();if(r.width<20||r.height<20)return;
    const s=Math.min(r.width/this.lw,r.height/this.lh),d=Math.min(window.devicePixelRatio||1,2.5);
    this.c.style.width=this.lw*s+'px';this.c.style.height=this.lh*s+'px';
    this.c.width=Math.round(this.lw*s*d);this.c.height=Math.round(this.lh*s*d);this.k=s*d;
  }
  begin(){const c=this.x;c.setTransform(this.k,0,0,this.k,0,0);c.clearRect(0,0,this.lw,this.lh);return c}
  pt(e){const r=this.c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*this.lw,y:(e.clientY-r.top)/r.height*this.lh}}
}
function refit(){ALLCV.forEach(c=>c.fit())}
window.addEventListener('resize',refit);

/* ---- 반짝이 파티클 ---- */
class FX{
  constructor(){this.a=[]}
  add(e,x,y,n,sp){for(let i=0;i<n;i++)this.a.push({e,x,y,vx:rand(-sp,sp),vy:rand(-sp*1.4,-sp*.2),l:1,s:rand(16,28)})}
  text(t,x,y,col){this.a.push({t,x,y,vx:0,vy:-45,l:1.1,s:24,col})}
  up(dt){for(const p of this.a){p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.t)p.vy+=220*dt;p.l-=dt*(p.t?.9:1.3)}this.a=this.a.filter(p=>p.l>0)}
  draw(c){
    c.textAlign='center';c.textBaseline='middle';
    for(const p of this.a){
      c.globalAlpha=clamp(p.l*1.4,0,1);
      if(p.t){c.font='900 '+p.s+'px '+KO;c.lineWidth=5;c.strokeStyle='#fff';c.strokeText(p.t,p.x,p.y);c.fillStyle=p.col||'#ff6fa3';c.fillText(p.t,p.x,p.y)}
      else{c.font=p.s+'px '+EMO;c.fillText(p.e,p.x,p.y)}
    }
    c.globalAlpha=1;
  }
}

/* ================= 친구들(캐릭터) ================= */
const SP=[
 {n:'몽글이',c:'#fff1ee',o:'#e8b4aa',belly:'#ffffff',ear:'none',ch:'#ffb3c1'},
 {n:'말랑이',c:'#ffb8d1',o:'#e98ab0',belly:'#ffe3ee',ear:'round',ch:'#ff7fa5'},
 {n:'보들이',c:'#ffe27a',o:'#e8bb3a',belly:'#fff4c4',ear:'cat',ch:'#ffa07a'},
 {n:'쫑이',c:'#ffab6b',o:'#e5803a',belly:'#fff0dc',ear:'fox',ch:'#ff8a7a'},
 {n:'토토',c:'#dac5ff',o:'#b095e8',belly:'#f4ecff',ear:'bunny',ch:'#ff9fc4'},
 {n:'뭉치',c:'#cfa07a',o:'#a07350',belly:'#f3dec6',ear:'round',ch:'#ff9a8a'},
 {n:'하늘이',c:'#a3dbff',o:'#62aee8',belly:'#e6f6ff',ear:'wing',ch:'#ff9fc4'},
 {n:'초롱이',c:'#aaeba8',o:'#62c25f',belly:'#e8fce6',ear:'leaf',ch:'#ff9fb0'},
 {n:'별이',c:'#ffe65e',o:'#e0b800',belly:'#fff8bd',ear:'star',ch:'#ff9a7a'},
 {n:'무지개',c:'rainbow',o:'#d98ac8',belly:'#ffffff',ear:'crown',ch:'#ff8fb8'},
 {n:'용용이',c:'#bda8ff',o:'#8f78e0',belly:'#efe8ff',ear:'horn',ch:'#ff9fc4'},
 {n:'달이',c:'#8f9bff',o:'#6670d8',belly:'#dfe3ff',ear:'moon',ch:'#ffb0d0'}
];
const HATS=['crown','party','bow','flower','cap','beanie'];
const FACES=['glasses','sun','stache'];
const TOPS={red:{c:'#ff6b6b'},blue:{c:'#5aa9ff',p:'stripe'},yellow:{c:'#ffd23f',p:'dots'},dress:{c:'#ff9ccf',p:'dress'},green:{c:'#5ccf8a',p:'overall'},purple:{c:'#9b6bff',p:'star'}};
const ACCS=['scarf','bowtie','wings','heart'];
const BODIES=['#ffb8d1','#ffe27a','#ffab6b','#dac5ff','#a3dbff','#aaeba8','#ffffff','#cfa07a'];

function shade(hex,amt){
  if(typeof hex!=='string'||hex[0]!=='#'||hex.length!==7)return '#b08ac0';
  const n=parseInt(hex.slice(1),16),f=v=>Math.round(clamp(v*(1+amt)+(amt>0?amt*60:0),0,255));
  return 'rgb('+f(n>>16&255)+','+f(n>>8&255)+','+f(n&255)+')';
}
function ell(c,x,y,rx,ry,fill,stroke,lw,rot){
  c.beginPath();c.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,TAU);
  if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}
}
function poly(c,pts,fill,stroke,lw){
  c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
  if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}
}
function star(c,x,y,ro,ri,fill,stroke,lw){
  const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?ri:ro;p.push([x+Math.cos(a)*r,y+Math.sin(a)*r])}
  poly(c,p,fill,stroke,lw);
}
function heart(c,x,y,s,fill){
  c.beginPath();c.moveTo(x,y+s*.9);
  c.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.7,y-s*1.2,x,y-s*.4);
  c.bezierCurveTo(x+s*.7,y-s*1.2,x+s*1.6,y-s*.2,x,y+s*.9);
  c.fillStyle=fill;c.fill();
}

/* 친구 그리기: (x,y)가 몸 중심, r이 반지름 */
function drawCritter(c,x,y,r,sp,o){
  o=o||{};const out=o.outfit||{},U=r,lw=Math.max(1,r*.07);
  const rainbow=(out.body||sp.c)==='rainbow';
  let fill=out.body||sp.c,ol=out.body?shade(out.body,-.2):sp.o;
  c.save();c.translate(x,y);c.scale(o.sx||1,o.sy||1);if(o.rot)c.rotate(o.rot);
  c.lineJoin='round';c.lineCap='round';
  if(rainbow){const g=c.createLinearGradient(0,-U,0,U);['#ffb3c7','#ffd9a8','#fff3a8','#bff0b8','#b8e2ff','#dcc6ff'].forEach((col,i,a)=>g.addColorStop(i/(a.length-1),col));fill=g}
  const ear=sp.ear;
  for(const s of[-1,1]){
    if(ear==='round'){ell(c,s*.62*U,-.72*U,.3*U,.3*U,fill,ol,lw);ell(c,s*.62*U,-.72*U,.15*U,.15*U,'#ffc9da')}
    else if(ear==='cat'){poly(c,[[s*.82*U,-.3*U],[s*.64*U,-1.08*U],[s*.12*U,-.82*U]],fill,ol,lw);poly(c,[[s*.68*U,-.45*U],[s*.6*U,-.88*U],[s*.3*U,-.74*U]],'#ffc9da')}
    else if(ear==='fox'){poly(c,[[s*.86*U,-.2*U],[s*.72*U,-1.28*U],[s*.1*U,-.85*U]],fill,ol,lw);poly(c,[[s*.7*U,-.42*U],[s*.66*U,-.96*U],[s*.34*U,-.76*U]],'#fff0dc')}
    else if(ear==='bunny'){ell(c,s*.38*U,-1.12*U,.17*U,.5*U,fill,ol,lw,s*.18);ell(c,s*.38*U,-1.1*U,.085*U,.34*U,'#ffc9da',null,0,s*.18)}
    else if(ear==='wing'){ell(c,s*1.0*U,.05*U,.3*U,.17*U,'#ffffff',ol,lw,s*-.7)}

const R=[14,19,25,32,40,49,59,70,82,95];
const MG={L:10,Rt:350,F:600,DANGER:135,SPAWN:75,balls:[],cur:0,next:0,dropX:180,holdX:180,cool:0,score:0,over:false,danger:0,fx:new FX(),banner:null,down:false,got:0,nid:0,acc:0};
const mRand=()=>pick([0,0,0,1,1,2,2,3]);
function mReset(){
  MG.balls=[];MG.score=0;MG.over=false;MG.danger=0;MG.cool=.4;MG.cur=mRand();MG.next=mRand();MG.banner=null;MG.fx.a=[];MG.got=0;
  $('#mOver').classList.remove('show');$('#mScore').textContent=0;
}
function mSetX(e){const p=MG.cv.pt(e);MG.dropX=clamp(p.x,MG.L+R[MG.cur],MG.Rt-R[MG.cur])}
function mDrop(){
  if(MG.over||MG.cool>0)return;
  const r=R[MG.cur];
  MG.balls.push({id:++MG.nid,x:clamp(MG.dropX,MG.L+r,MG.Rt-r),y:MG.SPAWN,vx:0,vy:0,l:MG.cur,r,age:0,pop:0});
  MG.cur=MG.next;MG.next=mRand();MG.cool=.55;sfx.drop();
}
function mFinish(){
  MG.over=true;sfx.over();
  if(MG.score>S.bestMerge)S.bestMerge=MG.score;save();
  $('#mFinal').textContent=MG.score;$('#mGot').textContent=MG.got;$('#mOver').classList.add('show');
}
function mMerge(a,b){
  a.dead=b.dead=true;
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,l=a.l;
  MG.score+=(l+1)*(l+2)/2;$('#mScore').textContent=MG.score;
  if(l>=R.length-1){
    MG.got+=10;addCoins(10);sfx.win();MG.fx.add('🌈',mx,my,6,200);MG.fx.add('⭐',mx,my,8,260);MG.fx.text('+10⭐',mx,my-30);MG.score+=60;return;
  }
  const g=l<5?1:l<8?2:4;MG.got+=g;addCoins(g);
  const nl=l+1;
  MG.balls.push({id:++MG.nid,x:mx,y:my,vx:(a.vx+b.vx)/2,vy:(a.vy+b.vy)/2-40,l:nl,r:R[nl],age:3,pop:1});
  sfx.merge(l);MG.fx.add('✨',mx,my,4,140);MG.fx.text('+'+g,mx,my-R[nl]-8);
  if(!S.unlocked.includes(nl)){S.unlocked.push(nl);save();MG.banner={sp:nl,t:2.6};speak(SP[nl].n)}
}
function mStep(h){
  const B=MG.balls;
  const wall=b=>{
    if(b.x<MG.L+b.r){b.x=MG.L+b.r;if(b.vx<0)b.vx*=-.1}
    if(b.x>MG.Rt-b.r){b.x=MG.Rt-b.r;if(b.vx>0)b.vx*=-.1}
    if(b.y>MG.F-b.r){b.y=MG.F-b.r;if(b.vy>0)b.vy*=-.1;b.vx*=.985}
  };
  for(const b of B){b.vy+=1500*h;b.x+=b.vx*h;b.y+=b.vy*h;b.age+=h;b.vx*=.9985;b.vy*=.9985;wall(b)}
  const merges=[];
  for(let it=0;it<4;it++){
    for(let i=0;i<B.length;i++){
      const a=B[i];
      for(let j=i+1;j<B.length;j++){
        const b=B[j],dx=b.x-a.x,dy=b.y-a.y,md=a.r+b.r;
        if(dx>md||dx<-md||dy>md||dy<-md)continue;
        const d2=dx*dx+dy*dy;if(d2>=md*md)continue;
        const d=Math.sqrt(d2)||.001,nx=dx/d,ny=dy/d,ov=md-d;
        if(it===0&&a.l===b.l)merges.push([a,b]);
        const ma=a.r*a.r,mb=b.r*b.r,t=ma+mb;
        a.x-=nx*ov*mb/t;a.y-=ny*ov*mb/t;b.x+=nx*ov*ma/t;b.y+=ny*ov*ma/t;
        const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(vn<0){const j2=-1.05*vn/(1/ma+1/mb);a.vx-=j2*nx/ma;a.vy-=j2*ny/ma;b.vx+=j2*nx/mb;b.vy+=j2*ny/mb}
      }
    }
    for(const b of B)wall(b);
  }
  for(const [a,b] of merges){if(!a.dead&&!b.dead)mMerge(a,b)}
  if(merges.length)MG.balls=MG.balls.filter(b=>!b.dead);
}
screens.merge={
  enter(){mReset()},
  update(dt){
    MG.fx.up(dt);if(MG.banner){MG.banner.t-=dt;if(MG.banner.t<=0)MG.banner=null}
    MG.cool=Math.max(0,MG.cool-dt);MG.holdX+=(MG.dropX-MG.holdX)*Math.min(1,dt*18);
    if(MG.over)return;
    MG.acc+=dt;let n=0;const H=1/120;
    while(MG.acc>=H&&n<6){mStep(H);MG.acc-=H;n++}if(n>=6)MG.acc=0;
    for(const b of MG.balls)b.pop*=Math.pow(.0008,dt);
    let any=false;for(const b of MG.balls)if(b.age>1.4&&b.y-b.r<MG.DANGER&&Math.abs(b.vy)<150)any=true;
    MG.danger=any?MG.danger+dt:Math.max(0,MG.danger-dt*2);
    if(MG.danger>2.6)mFinish();
  },
  draw(){
    const c=MG.cv.begin(),W=360,H=620;
    bg(c,W,H,'#ffe6f1','#dff0ff');
    c.fillStyle='rgba(255,255,255,.6)';c.strokeStyle='#ffb7d5';c.lineWidth=6;
    c.beginPath();c.roundRect?c.roundRect(MG.L-6,108,MG.Rt-MG.L+12,MG.F-108+8,18):c.rect(MG.L-6,108,MG.Rt-MG.L+12,MG.F-108+8);c.fill();c.stroke();
    c.setLineDash([10,8]);c.strokeStyle='rgba(255,90,130,'+(.28+(MG.danger>0?.5*Math.abs(Math.sin(T*8)):0))+')';c.lineWidth=3;
    c.beginPath();c.moveTo(MG.L,MG.DANGER);c.lineTo(MG.Rt,MG.DANGER);c.stroke();c.setLineDash([]);
    if(!MG.over&&MG.cool<=0){c.setLineDash([4,8]);c.strokeStyle='rgba(120,80,160,.25)';c.lineWidth=3;c.beginPath();c.moveTo(MG.holdX,MG.SPAWN+R[MG.cur]);c.lineTo(MG.holdX,MG.F);c.stroke();c.setLineDash([])}
    for(const b of MG.balls){
      const s=1+.28*b.pop;
      shadow(c,b.x,b.y+b.r*.95,b.r*.8);
      drawCritter(c,b.x,b.y,b.r,SP[b.l],{sx:s,sy:s,t:T+b.id*.7,mood:b.pop>.2?'open':null});
    }
    if(!MG.over){const k=clamp(1-MG.cool/.55,0,1);drawCritter(c,MG.holdX,MG.SPAWN,R[MG.cur]*k,SP[MG.cur],{t:T})}
    /* 다음 친구 */
    c.fillStyle='rgba(255,255,255,.85)';c.strokeStyle='#ffc2dc';c.lineWidth=4;c.beginPath();c.arc(318,52,36,0,TAU);c.fill();c.stroke();
    drawCritter(c,318,54,clamp(R[MG.next]*.62,9,24),SP[MG.next],{t:T});
    c.font='16px '+EMO;c.textAlign='center';c.fillText('▶',284,20);
    MG.fx.draw(c);
    if(MG.banner){
      const t=MG.banner.t,e=Math.min(1,(2.6-t)*3.5),sc=e<1?1+Math.sin(e*Math.PI)*.15:1,al=clamp(t*2,0,1);
      c.globalAlpha=al;c.fillStyle='rgba(255,255,255,.93)';c.strokeStyle='#ffb347';c.lineWidth=6;c.beginPath();c.roundRect?c.roundRect(40,230,280,210,30):c.rect(40,230,280,210);c.fill();c.stroke();
      c.font='900 26px '+KO;c.textAlign='center';c.fillStyle='#ff8a1f';c.fillText('✨ 새 친구! ✨',180,262);
      drawCritter(c,180,348,56*sc,SP[MG.banner.sp],{t:T,mood:'open'});
      c.font='900 28px '+KO;c.fillStyle='#6a4a7a';c.fillText(SP[MG.banner.sp].n,180,422);c.globalAlpha=1;
    }
  }

function rStart(i){
  RH.song=i;const sg=SONGS[i];RH.spb=60/sg.bpm;RH.notes=[];let beat=0;
  sg.n.split(' ').forEach(tk=>{
    const L=tk[0],d=+tk.slice(1);
    RH.notes.push({time:RH.LEAD+beat*RH.spb,f:FREQ[L],lane:LANE_OF[L],hit:false,miss:false,sp:LANE_SP[LANE_OF[L]]});
    tone(FREQ[L],Math.min(.5,d*RH.spb*.9),'sine',.05,RH.LEAD+beat*RH.spb);
    beat+=d;
  });
  RH.end=RH.LEAD+beat*RH.spb+1;RH.score=0;RH.combo=0;RH.hits=0;RH.fl=[0,0,0];RH.fx.a=[];RH.state='play';RH.t0=performance.now();

}
function rNow(){return(performance.now()-RH.t0)/1000}
function rTap(l){
  if(RH.state!=='play')return;
  RH.fl[l]=1;const now=rNow();let best=null,bd=9;
  for(const n of RH.notes){if(n.lane!==l||n.hit||n.miss)continue;const d=Math.abs(n.time-now);if(d<=RH.WIN&&d<bd){best=n;bd=d}}
  const x=60+l*120;

      if(Math.hypot(p.x-F.x,p.y-F.y)<r*1.2){F.hop=1;sfx.pop();HS.fx.add('💖',F.x,F.y-r,5,140);speak(SP[S.active].n)}
    }
  });
  hc.addEventListener('pointermove',e=>{if(!HS.drag||HS.sel<0)return;const p=HS.cv.pt(e),it=S.house.items[HS.sel];it.x=clamp(p.x+HS.drag.dx,20,340);it.y=clamp(p.y+HS.drag.dy,30,460)});
  const endDrag=()=>{if(HS.drag){HS.drag=null;save()}};
  hc.addEventListener('pointerup',endDrag);hc.addEventListener('pointercancel',endDrag);
  $('#hTrash').onclick=()=>{if(HS.sel>=0){S.house.items.splice(HS.sel,1);HS.sel=-1;$('#hTrash').hidden=true;save();sfx.no()}};
  /* 알 */
  $('#eggBuy').onclick=()=>{
    ac();
    if(S.coins<EGG_COST){sfx.no();const b=$('#eggBuy');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
    S.coins-=EGG_COST;save();updateCoins();EG.state='tap';EG.taps=0;EG.t=0;EG.wob=0;sfx.tap();eggUI();
  };
  $('#eggBook').onclick=()=>{sfx.tap();go('book')};
  EG.cv.c.addEventListener('pointerdown',e=>{
    ac();if(EG.state!=='tap')return;
    EG.taps++;EG.wob=1;EG.t=0;sfx.pop();const p=EG.cv.pt(e);EG.fx.add('✨',p.x,p.y,4,160);
    if(EG.taps>=3){
      EG.sp=eggPick();EG.isNew=!S.unlocked.includes(EG.sp);
      if(EG.isNew)S.unlocked.push(EG.sp);else S.coins+=5;
      save();updateCoins();EG.state='hatch';EG.t=0;eggUI();
    }
  });
  document.addEventListener('pointerdown',()=>ac(),{once:true});
}

load();
HM.cv=new Cv('#homeCv',360,200);MG.cv=new Cv('#mergeCv',360,620);RH.cv=new Cv('#rhythmCv',360,600);
DR.cv=new Cv('#dressCv',360,400);HS.cv=new Cv('#houseCv',360,480);EG.cv=new Cv('#eggCv',360,440);
wire();updateCoins();refit();setTimeout(refit,80);
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
window.__game={S:()=>S,MG,RH,EG,HS,go,mDrop,rTap,SP};
</script>
